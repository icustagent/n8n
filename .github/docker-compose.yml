services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT}:5678"
    env_file: 
      - .env
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      n8npostgres:
        condition: service_healthy
      n8nredis:
        condition: service_healthy
    networks:
      - n8nnetwork
      - apinetwork

  n8npostgres:
    image: postgres:18-alpine
    container_name: n8npostgres
    restart: unless-stopped
    volumes:
      - n8npostgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS="--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    command: postgres -c max_connections=200 -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - n8nnetwork

  n8nredis:
    image: redis:8-alpine
    container_name: n8nredis
    restart: unless-stopped
    volumes:
      - n8nredis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - n8nnetwork

networks:
  n8nnetwork:
    name: n8nnetwork
  apinetwork:
    name: apinetwork

volumes:
  n8n_data:
  n8npostgres_data:
  n8nredis_data:
